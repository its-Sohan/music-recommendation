name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t music-recommender:test .
      - name: Test Docker image
        run: docker run --rm -d -p 8000:8000 music-recommender:test
      - name: Health check
        run: sleep 5 && curl -f http://localhost:8000/api/health || exit 1
